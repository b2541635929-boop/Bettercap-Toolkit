[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bettercap-toolkit"
version = "1.0.0"
description = "A guided, lab-focused Python interface for Bettercap"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15", "PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
